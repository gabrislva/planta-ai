<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sacola · Planta Aí</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><header id="topo"></header>
<section><div class="wrap"><h2>Sua doação</h2><div class="box"><div id="l"></div>
<div class="line"><b>Total</b><b id="t"></b></div>
<form id="f"><label for="n">Seu nome</label><input id="n" required><label for="m">E-mail</label><input id="m" type="email" required>
<div class="aviso">Continue e contribua com um futuro melhor.</div>
<button class="btn">Doar por Pix</button></form></div></div></section><footer id="rodape"></footer><script src="js/data.js"></script><script src="js/app.js"></script><script>
function draw(){const c=cart.get();$("#t").textContent=brl(cart.total());
$("#l").innerHTML=c.map((i,n)=>`<div class="line"><span>${i.qtd}× ${esp(i.especie).nome} · ${i.bairro}</span><span>${brl(esp(i.especie).preco*i.qtd)} <button class="btn sec" data-n="${n}" style="padding:2px 10px">Remover</button></span></div>`).join("")||"<p>Sua sacola está vazia. <a href=plantas.html>Escolher árvores</a></p>";
$("#f").style.display=c.length?"block":"none";nav()}
$("#l").onclick=e=>{if(e.target.dataset.n){cart.remove(+e.target.dataset.n);draw()}};
$("#f").onsubmit=e=>{e.preventDefault();const o=db.get("orders",[]),id=Date.now();
cart.get().forEach((i,k)=>o.push({id:id+"-"+k,...i,doador:$("#n").value,email:$("#m").value,status:"pendente",data:new Date().toISOString()}));
db.set("orders",o);db.set("cart",[]);db.set("last",{nome:$("#n").value});location="obrigado.html"};draw();</script></body></html>
